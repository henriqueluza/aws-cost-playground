[project]
name = "acp-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=2.8,<3",
    "boto3>=1.44,<2",
    "fastapi>=0.163.1,<0.164",
    "mangum>=0.22,<0.23",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
]

[dependency-groups]
dev = [
    "import-linter>=2.16,<3",
    "moto>=5.2,<6",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false
exclude-newer = "7 days"  # cool-down de supply chain; relativo exige uv >= 0.13.8
required-version = ">=0.13.8"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Routers não acessam AWS nem a Claude API diretamente"
type = "forbidden"
source_modules = ["app.*.router"]
forbidden_modules = ["boto3", "botocore", "anthropic"]
# router -> service -> boto3 é o desenho pedido; só o import direto é proibido.
allow_indirect_imports = true
