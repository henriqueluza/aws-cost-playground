[project]
name = "acp-pricing"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["boto3>=1.44,<2"]

[dependency-groups]
dev = [
    "import-linter>=2.16,<3",
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false
exclude-newer = "7 days"  # cool-down de supply chain; relativo exige uv >= 0.13.8
required-version = ">=0.13.8"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "O script não depende da stack da API"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["fastapi", "anthropic", "mangum"]
