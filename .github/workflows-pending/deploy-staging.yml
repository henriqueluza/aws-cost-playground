name: Deploy staging

# Contrato (#22).
#
# Depois do merge em `main`, o job `build` constrói UMA vez o bundle do site e o zip das
# Lambdas e os guarda como o artefato `release-<sha>`. O job `deploy` usa só esse artefato
# (nunca reconstrói) e publica em staging nesta ordem: pacote no bucket de artefatos,
# Terraform, funções, site, /config.json, invalidação do CloudFront e smoke test.
#
# Artefato `release-${{ github.sha }}` (retenção de 90 dias), na raiz:
#   functions.zip  zip das Lambdas (scripts/build-functions.sh)
#   site/          conteúdo de web/dist
#   SHA256SUMS     sha256 em hex, caminhos relativos à raiz (`sha256sum -c SHA256SUMS`)
#
# Chave do pacote no S3: functions/<sha de 40 caracteres>.zip, igual a TF_VAR_package_key.
# A primeira escrita vence: se a chave já existe, não é sobrescrita, e o hash esperado das
# funções passa a ser o do objeto guardado (base64 do digest binário, como o CodeSha256).
#
# Variáveis do GitHub Environment `staging`: AWS_APPLY_ROLE_ARN (sem ela o deploy só avisa
# e termina verde) e TF_VAR_PACKAGE_BUCKET. Do repositório, já usadas pelo job plan:
# TF_STATE_BUCKET_STAGING, TF_VAR_ZONE_NAME e o secret TF_VAR_ALARM_EMAIL.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Sem cancelamento: dois merges seguidos entram em fila, e staging nunca regride para um
# commit mais velho no meio de um deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.16.0"

jobs:
  build:
    name: build (bundle e zip das Lambdas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build do site
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Montar o release
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          # O script imprime só o sha256 em hex; o SHA256SUMS abaixo é quem o registra.
          scripts/build-functions.sh "$RUNNER_TEMP/release/functions.zip" > /dev/null
          cp -R web/dist "$RUNNER_TEMP/release/site"
          # Ordem fixa (LC_ALL=C) e caminhos relativos à raiz: o deploy confere com
          # `sha256sum --check` dentro do diretório.
          cd "$RUNNER_TEMP/release"
          find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
          retention-days: 90
          if-no-files-found: error

  deploy:
    name: deploy (staging)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      id-token: write # OIDC para assumir o papel acp-ci-apply-staging
    # Ids dos passos, nesta ordem: gate (saída `configured` = true|false), download, verify,
    # aws, package, terraform, functions, site, config, invalidate, smoke, summary.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gate de configuração
        id: gate
        # Sem o papel (bootstrap ainda não aplicado) o deploy só avisa e termina verde. Com o
        # papel, falta de qualquer outra variável falha fechada. As mensagens citam só os
        # nomes, nunca os valores.
        env:
          AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
          TF_VAR_PACKAGE_BUCKET: ${{ vars.TF_VAR_PACKAGE_BUCKET }}
          TF_STATE_BUCKET_STAGING: ${{ vars.TF_STATE_BUCKET_STAGING }}
          TF_VAR_ZONE_NAME: ${{ vars.TF_VAR_ZONE_NAME }}
          TF_VAR_ALARM_EMAIL_SET: ${{ secrets.TF_VAR_ALARM_EMAIL != '' }}
        run: |
          if [ -z "${AWS_APPLY_ROLE_ARN:-}" ]; then
            echo "::warning::AWS_APPLY_ROLE_ARN não está cadastrada no environment staging: deploy pulado"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -n "${TF_VAR_PACKAGE_BUCKET:-}" ] || missing="$missing TF_VAR_PACKAGE_BUCKET"
          [ -n "${TF_STATE_BUCKET_STAGING:-}" ] || missing="$missing TF_STATE_BUCKET_STAGING"
          [ -n "${TF_VAR_ZONE_NAME:-}" ] || missing="$missing TF_VAR_ZONE_NAME"
          [ "${TF_VAR_ALARM_EMAIL_SET:-}" = "true" ] || missing="$missing TF_VAR_ALARM_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::faltam para o deploy de staging:$missing"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Baixar o release
        id: download
        if: steps.gate.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Conferir a integridade do release
        id: verify
        if: steps.gate.outputs.configured == 'true'
        working-directory: ${{ runner.temp }}/release
        run: sha256sum --check --strict SHA256SUMS

      - name: Credenciais AWS (OIDC)
        id: aws
        if: steps.gate.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publicar o pacote das Lambdas
        id: package
        if: steps.gate.outputs.configured == 'true'
        env:
          TF_VAR_PACKAGE_BUCKET: ${{ vars.TF_VAR_PACKAGE_BUCKET }}
        run: |
          zip="$RUNNER_TEMP/release/functions.zip"
          key="functions/$GITHUB_SHA.zip"
          b64=$(openssl dgst -sha256 -binary "$zip" | base64)
          # A primeira escrita vence (If-None-Match): um "re-run all jobs" reconstrói o zip
          # com outros bytes, e sobrescrever a chave trocaria o código de um commit já
          # publicado.
          if aws s3api put-object --bucket "$TF_VAR_PACKAGE_BUCKET" --key "$key" --body "$zip" \
            --checksum-algorithm SHA256 --checksum-sha256 "$b64" --if-none-match '*' \
            > /dev/null 2> "$RUNNER_TEMP/put.err"; then
            :
          elif grep -q 'PreconditionFailed' "$RUNNER_TEMP/put.err"; then
            stored=$(aws s3api head-object --bucket "$TF_VAR_PACKAGE_BUCKET" --key "$key" \
              --checksum-mode ENABLED --query ChecksumSHA256 --output text)
            if [ -z "$stored" ] || [ "$stored" = "None" ]; then
              echo "::error::o objeto $key já existe sem checksum SHA256; recusado (falha fechada)"
              exit 1
            fi
            if [ "$stored" != "$b64" ]; then
              echo "::warning::o pacote $key já existia com outro conteúdo; vale o objeto guardado"
            fi
            b64="$stored"
          else
            cat "$RUNNER_TEMP/put.err" >&2
            echo "::error::falha ao gravar o pacote $key no bucket de artefatos"
            exit 1
          fi
          echo "package_key=$key" >> "$GITHUB_OUTPUT"
          echo "code_sha256=$b64" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.gate.outputs.configured == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform (plan, plan-guard e aplicação do plano)
        id: terraform
        if: steps.gate.outputs.configured == 'true'
        working-directory: infra/envs/staging
        # Mesmas variáveis do job plan do terraform.yml, mas com o pacote real. O e-mail é o
        # único secret e só entra aqui; o plan.json (que o contém) é apagado ao final.
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_STAGING }}
          TF_VAR_zone_name: ${{ vars.TF_VAR_ZONE_NAME }}
          TF_VAR_alarm_email: ${{ secrets.TF_VAR_ALARM_EMAIL }}
          TF_VAR_package_bucket: ${{ vars.TF_VAR_PACKAGE_BUCKET }}
          TF_VAR_package_key: ${{ steps.package.outputs.package_key }}
          TF_IN_AUTOMATION: "true"
        run: |
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
          terraform plan -input=false -out="$RUNNER_TEMP/tfplan"
          terraform show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"
          # Aqui não existe liberação por label: plano com delete/replace/forget para o deploy.
          code=0
          python3 "$GITHUB_WORKSPACE/infra/tools/plan_guard.py" "$RUNNER_TEMP/plan.json" || code=$?
          rm -f "$RUNNER_TEMP/plan.json"
          if [ "$code" -ne 0 ]; then
            echo "::error::plan-guard reprovou o plano de staging (código $code); o deploy parou antes da aplicação"
            exit 1
          fi
          terraform apply -input=false "$RUNNER_TEMP/tfplan"
          terraform output -json > "$RUNNER_TEMP/outputs.json"
          {
            echo "site_bucket=$(jq -r '.site_bucket_name.value' "$RUNNER_TEMP/outputs.json")"
            echo "distribution_id=$(jq -r '.site_distribution_id.value' "$RUNNER_TEMP/outputs.json")"
            echo "site_url=$(jq -r '.site_url.value' "$RUNNER_TEMP/outputs.json")"
            echo "api_base_url=$(jq -r '.site_config.value.apiBaseUrl' "$RUNNER_TEMP/outputs.json")"
            echo "function_names=$(jq -r '[.function_names.value[]] | join(" ")' "$RUNNER_TEMP/outputs.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Conferir o código das funções
        id: functions
        if: steps.gate.outputs.configured == 'true'
        # O Terraform já troca o código quando a chave muda; aqui só se espera e confere.
        env:
          FUNCTION_NAMES: ${{ steps.terraform.outputs.function_names }}
          EXPECTED: ${{ steps.package.outputs.code_sha256 }}
        run: |
          for fn in $FUNCTION_NAMES; do
            aws lambda wait function-updated-v2 --function-name "$fn"
            actual=$(aws lambda get-function-configuration --function-name "$fn" --query CodeSha256 --output text)
            if [ "$actual" != "$EXPECTED" ]; then
              echo "::error::a função $fn não roda o pacote esperado (CodeSha256 diferente)"
              exit 1
            fi
          done

      - name: Publicar o site
        id: site
        if: steps.gate.outputs.configured == 'true'
        # Sem `--delete` nem `sync`: os assets com hash do build anterior continuam no bucket
        # para quem ainda está com o index.html antigo; por isso os assets sobem primeiro.
        # O Cache-Control vem da response headers policy do CloudFront, não do objeto.
        # O config.json do bundle (valores de dev) nunca vai: o passo `config` publica o real.
        env:
          BUCKET: ${{ steps.terraform.outputs.site_bucket }}
        run: |
          site="$RUNNER_TEMP/release/site"
          if [ -d "$site/assets" ]; then
            aws s3 cp "$site/assets" "s3://$BUCKET/assets" --recursive
          fi
          aws s3 cp "$site" "s3://$BUCKET" --recursive --exclude "assets/*" --exclude "config.json"

      - name: Publicar o config.json
        id: config
        if: steps.gate.outputs.configured == 'true'
        env:
          BUCKET: ${{ steps.terraform.outputs.site_bucket }}
        run: |
          jq -e '
            (.site_config.value.apiBaseUrl | type == "string" and startswith("https://"))
            and (.site_config.value.cognitoAuthority | type == "string" and startswith("https://"))
            and (.site_config.value.cognitoClientId | type == "string" and length > 0)
          ' "$RUNNER_TEMP/outputs.json" > /dev/null || {
            echo "::error::site_config inválido: exigem-se apiBaseUrl e cognitoAuthority (https://) e cognitoClientId"
            exit 1
          }
          jq -c '.site_config.value' "$RUNNER_TEMP/outputs.json" > "$RUNNER_TEMP/config.json"
          aws s3 cp "$RUNNER_TEMP/config.json" "s3://$BUCKET/config.json" --content-type application/json

      - name: Invalidar o CloudFront
        id: invalidate
        if: steps.gate.outputs.configured == 'true'
        # Um caminho só (`/*`) cabe na cota grátis de 1000 caminhos/mês e cobre `/`, que
        # `/index.html` sozinho não cobre.
        env:
          DISTRIBUTION_ID: ${{ steps.terraform.outputs.distribution_id }}
        run: |
          inv=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$inv"

      - name: Smoke test
        id: smoke
        if: steps.gate.outputs.configured == 'true'
        env:
          SITE_URL: ${{ steps.terraform.outputs.site_url }}
          API_BASE_URL: ${{ steps.terraform.outputs.api_base_url }}
        run: |
          curl_opts=(--fail --silent --show-error --max-time 15 --retry 5 --retry-delay 10 --retry-all-errors)
          curl "${curl_opts[@]}" --output /dev/null "$SITE_URL/"
          curl "${curl_opts[@]}" "$SITE_URL/config.json" > "$RUNNER_TEMP/served.json"
          if [ "$(jq -S . "$RUNNER_TEMP/served.json")" != "$(jq -S . "$RUNNER_TEMP/config.json")" ]; then
            echo "::error::o /config.json servido difere do publicado"
            exit 1
          fi
          # Sem token a API tem de recusar com 401. Repete por causa da propagação do DNS.
          code=000
          for _ in 1 2 3 4 5 6; do
            code=$(curl --silent --max-time 15 --output /dev/null --write-out '%{http_code}' "$API_BASE_URL/quota" || true)
            [ "$code" = "401" ] && exit 0
            sleep 10
          done
          echo "::error::GET /quota sem token devolveu $code (esperado 401)"
          exit 1

      - name: Resumo
        id: summary
        if: steps.gate.outputs.configured == 'true'
        env:
          PACKAGE_KEY: ${{ steps.package.outputs.package_key }}
          CODE_SHA256: ${{ steps.package.outputs.code_sha256 }}
        run: |
          {
            echo "### Deploy de staging"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Pacote: \`$PACKAGE_KEY\`"
            echo "- code_sha256: \`$CODE_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
