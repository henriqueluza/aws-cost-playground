# Atualiza o catálogo de preços: gera web/public/prices/ a partir da Price List
# API e mantém um único PR (branch prices/catalogo) com o resultado.
#
# - O PR sai pelo GITHUB_TOKEN, que não dispara o gatilho pull_request: o autor
#   fecha e reabre o PR para o CI rodar.
# - O trust do papel `prices` (#125) espera
#   sub = repo:henriqueluza/aws-cost-playground:ref:refs/heads/main
#   (sem `environment:`).
# - O repositório precisa ter "Allow GitHub Actions to create and approve pull
#   requests" ligado para o `gh pr create` funcionar.
# - Sem a variável de repositório AWS_PRICES_ROLE_ARN o job avisa e termina verde.
name: Preços

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  catalog:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Verificar configuração
        id: gate
        env:
          ROLE: ${{ vars.AWS_PRICES_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::warning::Falta a variável de repositório AWS_PRICES_ROLE_ARN (papel prices da #125). Job ignorado."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        id: checkout
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        id: uv
        if: steps.gate.outputs.configured == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false

      - name: Credenciais AWS (OIDC)
        id: aws
        if: steps.gate.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PRICES_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900

      - name: Gerar catálogo e resumo
        id: generate
        if: steps.gate.outputs.configured == 'true'
        working-directory: pricing
        env:
          UV_LOCKED: "1"
        run: |
          uv sync --locked
          uv run python -m app > "$RUNNER_TEMP/report.txt"
          uv run python -m app.summary < "$RUNNER_TEMP/report.txt" > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar PR
        id: publish
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh auth setup-git
          bash scripts/prices-pr.sh "$RUNNER_TEMP/body.md"
