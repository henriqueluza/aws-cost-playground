name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check YAML syntax
        run: |
          for f in $(find .github -name "*.yml" -o -name "*.yaml"); do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" || exit 1
          done
      - name: Check agent kit (skills, subagents, rules, settings)
        run: |
          python3 - <<'PY'
          import glob, json, sys, yaml
          errors = []
          def front(path, required):
              text = open(path, encoding="utf-8").read()
              if not text.startswith("---\n"):
                  errors.append(f"{path}: sem frontmatter"); return
              meta = yaml.safe_load(text.split("---\n", 2)[1]) or {}
              for k in required:
                  if not meta.get(k): errors.append(f"{path}: falta '{k}'")
          for p in glob.glob(".claude/skills/*/SKILL.md"): front(p, ["name", "description"])
          for p in glob.glob(".claude/agents/*.md"): front(p, ["name", "description"])
          for p in glob.glob(".claude/rules/*.md"):
              if open(p, encoding="utf-8").read().startswith("---\n"): front(p, ["paths"])
          for p in [".claude/settings.json", ".mcp.json"]:
              try: json.load(open(p))
              except Exception as e: errors.append(f"{p}: JSON inválido ({e})")
          print("\n".join(errors) or "kit ok"); sys.exit(1 if errors else 0)
          PY
      - name: Codex mirror in sync
        run: |
          cp -R .agents/skills /tmp/committed && ./scripts/sync-agents-mirror.sh
          diff -r /tmp/committed .agents/skills || { echo "::error::.agents/skills desatualizado. Rode scripts/sync-agents-mirror.sh"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web — format, lint, typecheck, testes e build
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npx prettier --check .
          npx eslint .
          npx tsc --noEmit
          npm test -- --run
          npm run build
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: |
            api/uv.lock
            pricing/uv.lock
      - name: API — format, lint, tipos, arquitetura e testes
        working-directory: api
        env:
          UV_LOCKED: "1" # todo `uv run` também falha se o lock estiver desatualizado
        run: |
          uv sync --locked
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy app
          uv run lint-imports
          uv run pytest -q --cov
      - name: Pricing — format, lint, tipos, arquitetura e testes
        working-directory: pricing
        env:
          UV_LOCKED: "1" # todo `uv run` também falha se o lock estiver desatualizado
        run: |
          uv sync --locked
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy app
          uv run lint-imports
          uv run pytest -q --cov
