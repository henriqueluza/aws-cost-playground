# Atualiza o catálogo de preços: gera web/public/prices/ a partir da Price List
# API e mantém um único PR (branch prices/catalogo) com o resultado.
#
# Dois jobs, para que nenhum passo tenha ao mesmo tempo a credencial da AWS e um
# token com escrita no repositório:
# - generate: assume o papel `prices` por OIDC (só pricing:GetProducts), roda o
#   gerador com `contents: read` e entrega catálogo e corpo do PR num artefato.
# - publish: sem AWS; recebe o artefato e roda scripts/prices-pr.sh com o
#   GITHUB_TOKEN (push fast-forward em prices/catalogo, nunca em main).
#
# - O PR sai pelo GITHUB_TOKEN, que não dispara o gatilho pull_request: o autor
#   fecha e reabre o PR para o CI rodar. O workflow não aplica labels nem faz merge.
# - O trust do papel `prices` (#125) espera
#   sub = repo:henriqueluza/aws-cost-playground:ref:refs/heads/main
#   (sem `environment:`): só roda em main.
# - O repositório precisa ter "Allow GitHub Actions to create and approve pull
#   requests" ligado para o `gh pr create` funcionar.
# - Sem a variável de repositório AWS_PRICES_ROLE_ARN o job avisa e termina verde.
# - O checkout é sempre o de main por branch (sem `ref:`): o script de publicação
#   exige HEAD = origin/main.
name: Preços

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      configured: ${{ steps.gate.outputs.configured }}
    steps:
      - name: Verificar configuração
        id: gate
        env:
          ROLE: ${{ vars.AWS_PRICES_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::warning::Falta a variável de repositório AWS_PRICES_ROLE_ARN (papel prices da #125). Job ignorado."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        id: checkout
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        id: uv
        if: steps.gate.outputs.configured == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false

      - name: Instalar dependências
        id: deps
        if: steps.gate.outputs.configured == 'true'
        working-directory: pricing
        env:
          UV_LOCKED: "1"
        run: uv sync --locked

      - name: Credenciais AWS (OIDC)
        id: aws
        if: steps.gate.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PRICES_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900

      - name: Gerar catálogo e resumo
        id: generate
        if: steps.gate.outputs.configured == 'true'
        working-directory: pricing
        env:
          UV_LOCKED: "1"
        run: |
          out="$RUNNER_TEMP/catalog"
          mkdir -p "$out"
          uv run python -m app > "$RUNNER_TEMP/report.txt"
          uv run python -m app.summary < "$RUNNER_TEMP/report.txt" > "$out/body.md"
          if grep -qxF 'nenhum serviço com consulta: nada a gravar' "$RUNNER_TEMP/report.txt"; then
            echo "::warning::Nenhum serviço com consulta: o gerador não gravou nada e o catálogo não foi atualizado."
          fi
          cp -R ../web/public/prices "$out/prices"
          cat "$out/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar catálogo
        id: upload
        if: steps.gate.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: generate
    if: github.ref == 'refs/heads/main' && needs.generate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baixar catálogo
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog

      - name: Aplicar catálogo
        id: apply
        run: |
          src="$RUNNER_TEMP/catalog"
          if [ ! -s "$src/body.md" ] || [ ! -s "$src/prices/manifest.json" ]; then
            echo "::error::Artefato incompleto: falta body.md ou prices/manifest.json."
            exit 1
          fi
          if [ -n "$(find "$src" -type l -print -quit)" ]; then
            echo "::error::Artefato com link simbólico: recusado."
            exit 1
          fi
          rm -rf web/public/prices
          cp -R "$src/prices" web/public/prices

      - name: Publicar PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh auth setup-git
          bash scripts/prices-pr.sh "$RUNNER_TEMP/catalog/body.md"
