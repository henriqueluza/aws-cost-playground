# TEMPORÁRIO (#366): mostra as claims não secretas do token OIDC do job, para conferir o
# formato do `sub` antes de ajustar os trusts do bootstrap. Não assume papel nenhum e não
# chega a `main`: é removido no mesmo PR.
name: OIDC sub debug

on:
  pull_request:
    paths:
      - .github/workflows/oidc-sub-debug.yml

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mostrar claims não secretas do token OIDC
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import base64, json, os, sys, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(
              url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]}
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              token = json.load(resp)["value"]
          # Mascara o token inteiro e cada segmento antes de qualquer outra saída.
          print("::add-mask::" + token, flush=True)
          for part in token.split("."):
              print("::add-mask::" + part, flush=True)
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          del token, payload
          allowed = [
              "sub", "aud", "iss", "repository", "repository_id", "repository_owner_id",
              "ref", "event_name", "job_workflow_ref", "environment",
          ]
          for name in allowed:
              print(f"claim {name} = {claims.get(name, '(ausente)')}")
          PY
