name: Deploy production

# Contrato (#23).
#
# Só roda por disparo manual de um humano, com o SHA a publicar. Nada é reconstruído: o job
# `check` acha o run de `deploy-staging.yml` desse SHA, exige que o deploy e o smoke test de
# staging tenham passado e baixa o artefato `release-<sha>` DESSE run. O job `deploy` baixa o
# mesmo artefato de novo e publica em produção na mesma ordem de staging: pacote no bucket de
# artefatos, Terraform, funções, site, /config.json, invalidação do CloudFront e smoke test.
#
# Recusas (infra/tools/release_gate.py), todas antes de qualquer credencial da AWS:
#   - SHA fora do formato de 40 hexadecimais, workflow fora de `main` ou commit fora de `main`;
#   - SHA sem deploy de staging com sucesso (run verde com o deploy pulado não conta);
#   - artefato expirado (90 dias) ou que não confere com o SHA256SUMS;
#   - `site/prices/manifest.json` com `source` diferente de `price-list` (`seed` é recusado).
#
# O Terraform aplicado é o de `infra/envs/production` NO SHA informado (checkout em
# `release-src/`); as ferramentas (release-gate, plan-guard, smoke) vêm do commit do disparo.
# Rollback: o mesmo workflow com o SHA anterior (docs/runbooks/rollback.md).
#
# Variáveis do GitHub Environment `production`: AWS_APPLY_ROLE_ARN e TF_VAR_PACKAGE_BUCKET.
# Do repositório: TF_STATE_BUCKET_PRODUCTION, TF_VAR_ZONE_NAME e o secret TF_VAR_ALARM_EMAIL.
# Falta de qualquer uma falha fechada.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA completo (40 caracteres) de um commit de main já publicado em staging"
        required: true
        type: string

permissions:
  contents: read

# Um deploy de produção por vez, e o que está em andamento nunca é cancelado.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.16.0"

jobs:
  check:
    name: check (SHA, staging e preços)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # ler o run de staging e baixar o artefato dele
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      run_id: ${{ steps.staging.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # o release-gate confere se o SHA é ancestral de origin/main
      - name: Validar o SHA
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha=$(python3 infra/tools/release_gate.py sha "$INPUT_SHA" --ref "$GITHUB_REF")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Achar o deploy de staging do SHA
        id: staging
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-staging.yml/runs" \
            -f head_sha="$SHA" -f per_page=100 > "$RUNNER_TEMP/runs.json"
          run_id=$(python3 infra/tools/release_gate.py staging-run "$SHA" "$RUNNER_TEMP/runs.json")
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
            -f filter=latest -f per_page=100 > "$RUNNER_TEMP/jobs.json"
          python3 infra/tools/release_gate.py staging-jobs "$RUNNER_TEMP/jobs.json"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Baixar o release de staging
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ steps.sha.outputs.sha }}
          path: ${{ runner.temp }}/release
          run-id: ${{ steps.staging.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Conferir a integridade e a origem dos preços
        run: |
          (cd "$RUNNER_TEMP/release" && sha256sum --check --strict SHA256SUMS)
          python3 infra/tools/release_gate.py prices "$RUNNER_TEMP/release"

  deploy:
    name: deploy (production)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read # baixar o artefato do run de staging
      id-token: write # OIDC para assumir o papel acp-ci-apply-production
    # Ids dos passos, nesta ordem: gate, source, download, verify, aws, package, terraform,
    # functions, site, config, invalidate, smoke, summary.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gate de configuração
        id: gate
        # Produção nunca é pulada em silêncio: falta de qualquer valor falha fechada. As
        # mensagens citam só os nomes, nunca os valores.
        env:
          AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
          TF_VAR_PACKAGE_BUCKET: ${{ vars.TF_VAR_PACKAGE_BUCKET }}
          TF_STATE_BUCKET_PRODUCTION: ${{ vars.TF_STATE_BUCKET_PRODUCTION }}
          TF_VAR_ZONE_NAME: ${{ vars.TF_VAR_ZONE_NAME }}
          TF_VAR_ALARM_EMAIL_SET: ${{ secrets.TF_VAR_ALARM_EMAIL != '' }}
        run: |
          missing=""
          [ -n "${AWS_APPLY_ROLE_ARN:-}" ] || missing="$missing AWS_APPLY_ROLE_ARN"
          [ -n "${TF_VAR_PACKAGE_BUCKET:-}" ] || missing="$missing TF_VAR_PACKAGE_BUCKET"
          [ -n "${TF_STATE_BUCKET_PRODUCTION:-}" ] || missing="$missing TF_STATE_BUCKET_PRODUCTION"
          [ -n "${TF_VAR_ZONE_NAME:-}" ] || missing="$missing TF_VAR_ZONE_NAME"
          [ "${TF_VAR_ALARM_EMAIL_SET:-}" = "true" ] || missing="$missing TF_VAR_ALARM_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::faltam para o deploy de produção:$missing"
            exit 1
          fi

      - name: Terraform do SHA publicado
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          path: release-src
          persist-credentials: false

      - name: Baixar o release de staging
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.check.outputs.sha }}
          path: ${{ runner.temp }}/release
          run-id: ${{ needs.check.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Conferir a integridade e a origem dos preços
        id: verify
        # De novo, porque este job baixa o artefato outra vez.
        run: |
          (cd "$RUNNER_TEMP/release" && sha256sum --check --strict SHA256SUMS)
          python3 infra/tools/release_gate.py prices "$RUNNER_TEMP/release"

      - name: Credenciais AWS (OIDC)
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publicar o pacote das Lambdas
        id: package
        env:
          TF_VAR_PACKAGE_BUCKET: ${{ vars.TF_VAR_PACKAGE_BUCKET }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          zip="$RUNNER_TEMP/release/functions.zip"
          key="functions/$SHA.zip"
          b64=$(openssl dgst -sha256 -binary "$zip" | base64)
          # A primeira escrita vence (If-None-Match). Num rollback a chave já existe: só segue
          # se o objeto guardado for byte a byte o zip do artefato de staging.
          if aws s3api put-object --bucket "$TF_VAR_PACKAGE_BUCKET" --key "$key" --body "$zip" \
            --checksum-algorithm SHA256 --checksum-sha256 "$b64" --if-none-match '*' \
            > /dev/null 2> "$RUNNER_TEMP/put.err"; then
            :
          elif grep -qE 'PreconditionFailed|ConditionalRequestConflict' "$RUNNER_TEMP/put.err"; then
            stored=$(aws s3api head-object --bucket "$TF_VAR_PACKAGE_BUCKET" --key "$key" \
              --checksum-mode ENABLED --query ChecksumSHA256 --output text)
            if [ -z "$stored" ] || [ "$stored" = "None" ]; then
              echo "::error::o objeto $key já existe sem checksum SHA256; recusado (falha fechada)"
              exit 1
            fi
            if [ "$stored" != "$b64" ]; then
              echo "::error::$key já existe com outro conteúdo; recusado (falha fechada)"
              exit 1
            fi
          else
            cat "$RUNNER_TEMP/put.err" >&2
            echo "::error::falha ao gravar o pacote $key no bucket de artefatos"
            exit 1
          fi
          echo "package_key=$key" >> "$GITHUB_OUTPUT"
          echo "code_sha256=$b64" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform (plan, plan-guard e aplicação do plano)
        id: terraform
        working-directory: release-src/infra/envs/production
        # Mesmo passo de staging. O e-mail é o único secret e só entra aqui; o plan.json (que
        # o contém) é apagado ao final.
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET_PRODUCTION }}
          TF_VAR_zone_name: ${{ vars.TF_VAR_ZONE_NAME }}
          TF_VAR_alarm_email: ${{ secrets.TF_VAR_ALARM_EMAIL }}
          TF_VAR_package_bucket: ${{ vars.TF_VAR_PACKAGE_BUCKET }}
          TF_VAR_package_key: ${{ steps.package.outputs.package_key }}
        run: |
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
          terraform plan -input=false -out="$RUNNER_TEMP/tfplan"
          terraform show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"
          # Sem liberação por label: plano com delete/replace/forget para o deploy. O
          # plan-guard é o do commit do disparo, não o do SHA publicado.
          code=0
          python3 "$GITHUB_WORKSPACE/infra/tools/plan_guard.py" "$RUNNER_TEMP/plan.json" || code=$?
          rm -f "$RUNNER_TEMP/plan.json"
          if [ "$code" -ne 0 ]; then
            echo "::error::plan-guard reprovou o plano de produção (código $code); o deploy parou antes da aplicação"
            exit 1
          fi
          terraform apply -input=false "$RUNNER_TEMP/tfplan"
          terraform output -json > "$RUNNER_TEMP/outputs.json"
          site_bucket=$(jq -er '.site_bucket_name.value' "$RUNNER_TEMP/outputs.json")
          distribution_id=$(jq -er '.site_distribution_id.value' "$RUNNER_TEMP/outputs.json")
          site_url=$(jq -er '.site_url.value' "$RUNNER_TEMP/outputs.json")
          api_base_url=$(jq -er '.site_config.value.apiBaseUrl' "$RUNNER_TEMP/outputs.json")
          function_names=$(jq -er '[.function_names.value[]] | join(" ")' "$RUNNER_TEMP/outputs.json")
          {
            echo "site_bucket=$site_bucket"
            echo "distribution_id=$distribution_id"
            echo "site_url=$site_url"
            echo "api_base_url=$api_base_url"
            echo "function_names=$function_names"
          } >> "$GITHUB_OUTPUT"

      - name: Conferir o código das funções
        id: functions
        env:
          FUNCTION_NAMES: ${{ steps.terraform.outputs.function_names }}
          EXPECTED: ${{ steps.package.outputs.code_sha256 }}
        run: |
          [ -n "$FUNCTION_NAMES" ] || { echo "::error::nenhuma função nas saídas do Terraform"; exit 1; }
          for fn in $FUNCTION_NAMES; do
            aws lambda wait function-updated-v2 --function-name "$fn"
            actual=$(aws lambda get-function-configuration --function-name "$fn" --query CodeSha256 --output text)
            if [ "$actual" != "$EXPECTED" ]; then
              echo "::error::a função $fn não roda o pacote esperado (CodeSha256 diferente)"
              exit 1
            fi
          done

      - name: Publicar o site
        id: site
        # Sem `--delete` nem `sync`: os assets com hash da versão anterior continuam no bucket
        # (é o que deixa o rollback servir o index.html antigo); os assets sobem primeiro.
        # O config.json do bundle (valores de dev) nunca vai: o passo `config` publica o real.
        env:
          BUCKET: ${{ steps.terraform.outputs.site_bucket }}
        run: |
          site="$RUNNER_TEMP/release/site"
          if [ -d "$site/assets" ]; then
            aws s3 cp "$site/assets" "s3://$BUCKET/assets" --recursive
          fi
          aws s3 cp "$site" "s3://$BUCKET" --recursive --exclude "assets/*" --exclude "config.json"

      - name: Publicar o config.json
        id: config
        env:
          BUCKET: ${{ steps.terraform.outputs.site_bucket }}
        run: |
          jq -e '
            (.site_config.value.apiBaseUrl | type == "string" and startswith("https://"))
            and (.site_config.value.cognitoAuthority | type == "string" and startswith("https://"))
            and (.site_config.value.cognitoClientId | type == "string" and length > 0)
          ' "$RUNNER_TEMP/outputs.json" > /dev/null || {
            echo "::error::site_config inválido: exigem-se apiBaseUrl e cognitoAuthority (https://) e cognitoClientId"
            exit 1
          }
          jq -c '.site_config.value' "$RUNNER_TEMP/outputs.json" > "$RUNNER_TEMP/config.json"
          aws s3 cp "$RUNNER_TEMP/config.json" "s3://$BUCKET/config.json" --content-type application/json

      - name: Invalidar o CloudFront
        id: invalidate
        # Um caminho só (`/*`) cabe na cota grátis de 1000 caminhos/mês e cobre `/`.
        env:
          DISTRIBUTION_ID: ${{ steps.terraform.outputs.distribution_id }}
        run: |
          inv=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$inv"

      - name: Smoke test
        id: smoke
        env:
          SITE_URL: ${{ steps.terraform.outputs.site_url }}
          API_BASE_URL: ${{ steps.terraform.outputs.api_base_url }}
        run: |
          scripts/smoke-test.sh "$SITE_URL" "$API_BASE_URL" "$RUNNER_TEMP/config.json" \
            "$RUNNER_TEMP/release/site/prices/manifest.json"

      - name: Resumo
        id: summary
        env:
          SHA: ${{ needs.check.outputs.sha }}
          STAGING_RUN_ID: ${{ needs.check.outputs.run_id }}
          PACKAGE_KEY: ${{ steps.package.outputs.package_key }}
          CODE_SHA256: ${{ steps.package.outputs.code_sha256 }}
        run: |
          {
            echo "### Deploy de produção"
            echo ""
            echo "- Commit publicado: \`$SHA\`"
            echo "- Run de staging de origem: \`$STAGING_RUN_ID\`"
            echo "- Pacote: \`$PACKAGE_KEY\`"
            echo "- code_sha256: \`$CODE_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
